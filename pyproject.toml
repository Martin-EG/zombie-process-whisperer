[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zombie-process-whisperer"
version = "0.1.0"
description = "Find abandoned branches, containers, cron jobs and zombie processes; a local model writes their eulogies."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "psutil>=5.9",
    "rich>=13.0",
    "ollama>=0.3",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
zombie = "zombie.cli:main"

[tool.setuptools.packages.find]
include = ["zombie*"]

[tool.setuptools.package-data]
"zombie.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
